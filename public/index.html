<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e11d48" />
    <title>Organic Dragon Fruit | Farm Fresh & 100% Natural</title>

    <!-- 👉 THIS ONE LINE ENABLES ALL STYLING INSTANTLY 👈 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for crisp tropical aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Hidden form for Netlify form collection -->
    <form
      name="dragonfruit-contact"
      netlify
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="variety"></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
